server.port=${PORT:8000}
cinemaabyss.proxy.monolith-url=${MONOLITH_URL:http://localhost:8080}
cinemaabyss.proxy.routes[0].path=/api/events
cinemaabyss.proxy.routes[0].service-url=${EVENTS_SERVICE_URL:http://localhost:8082}
cinemaabyss.proxy.routes[1].path=/api/movies
cinemaabyss.proxy.routes[1].service-url=${MOVIES_SERVICE_URL:http://localhost:8081}
cinemaabyss.proxy.routes[1].gradual-migration=${GRADUAL_MIGRATION:true}
cinemaabyss.proxy.routes[1].migration-percent=${MOVIES_MIGRATION_PERCENT:50}
